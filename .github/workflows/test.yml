name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    # The same suite on the oldest PHP the app starter takes and on a current one.
    name: codeigniter-steps test suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE_DIR: ${{ github.workspace }}/../codeigniter-app
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build the test app with DDEV (the official app starter and auth library)
        run: .github/scripts/build-ddev-site.sh

      - name: Check the app is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Built: $LAUNCH_URL, default: $DEFAULT_URL"
          test "${LAUNCH_URL%/}" = "$DEFAULT_URL"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the app as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        run: npm run test:must-fail

      - name: Run the development lane (the app in development, then in production again)
        run: |
          (cd "$SITE_DIR" && ddev exec php spark env development)
          status=0
          CUCUMBER_TAGS=@development npx cucumber-js || status=$?
          MUST_FAIL_TAGS="@must-fail and @development" npm run test:must-fail || status=$?
          (cd "$SITE_DIR" && ddev exec php spark env production)
          exit $status

      - name: Show the log of the app
        if: failure()
        run: (cd "$SITE_DIR" && ddev exec 'tail -n 200 writable/logs/*.log' || true)

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-php-${{ matrix.php }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-php-${{ matrix.php }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
